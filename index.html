<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posture Buddy</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
  :root { --bg: #12171c; --panel: #1a2128; --line: #2a333c; --text: #dde3e8; --dim: #8b97a3; --good: #6fd39a; --warn: #f0c060; --bad: #f07a6a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 340px; }
  #stage { position: relative; min-height: 0; }
  #stage canvas { display: block; }
  #panel { background: var(--panel); border-left: 1px solid var(--line); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .cam { position: relative; aspect-ratio: 4/3; background: #000; border-radius: 8px; overflow: hidden; }
  .cam video, .cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
  #camMsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--dim); }
  #banner { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.5); font-size: 15px; display: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select { background: #26303a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #2f6b4f; border-color: #3d8a66; }
  .metric { display: grid; grid-template-columns: 112px 1fr 44px; gap: 8px; align-items: center; }
  .metric .name { color: var(--dim); }
  .bar { height: 8px; background: #0e1317; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--good); transition: width .15s, background .3s; }
  .metric .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
  #score { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .foot { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .lcd { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
  #lcdPreview canvas { display: block; width: auto; height: auto; max-width: 160px; max-height: 160px; border-radius: 4px; background: #000; }
  input[type=text] { background: #0e1317; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; width: 110px; }
  details { border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--dim); }
  .slider { display: grid; grid-template-columns: 96px 1fr; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); }
  .study { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
  .study input[type=text] { width: 64px; }
  input[type=password] { background: #0e1317; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  #studyStatus { color: var(--text); }
  body.participant { grid-template-columns: 1fr; }
  body.participant #panel { display: none; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } #panel { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="stage"><div id="banner"></div></div>
<aside id="panel">
  <div class="cam">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="camMsg">Loading pose model…</div>
  </div>
  <div class="row">
    <button id="startBtn" class="primary" disabled>Start camera</button>
    <button id="calBtn" disabled>Calibrate (sit tall)</button>
  </div>
  <div class="study">
    <div class="row" style="justify-content: space-between"><b>Study</b><span class="foot" id="studyCond"></span></div>
    <div class="row">
      <label>Participant <input type="text" id="pid" placeholder="P01" spellcheck="false"></label>
      <label>Order <select id="order"><option value="A">A: passive → active</option><option value="B">B: active → passive</option></select></label>
      <label>Session <select id="session"><option>1</option><option>2</option></select></label>
    </div>
    <div class="row">
      <button id="studyStart" class="primary">Start session</button>
      <button id="studyStop" disabled>End early</button>
      <button id="studyRescore" title="Re-score this participant's recorded sessions">Re-score</button>
      <button id="studyDownload" title="Download this participant's recordings, scores and summary">Download</button>
      <button id="participantView" title="Show only the artifact; press Esc to come back">Participant view</button>
    </div>
    <div class="row">
      <label title="Where study recordings and scores are saved">Save to <select id="saveTo">
        <option value="cloud">Cloudflare</option><option value="local">This Mac (data/)</option></select></label>
      <input type="password" id="studyKey" placeholder="study key" autocomplete="off" spellcheck="false"
        title="The study key set in Cloudflare; saved in this browser only" style="width:110px">
    </div>
    <div class="foot" id="studyStatus"></div>
  </div>
  <div class="row">
    <label>Source <select id="src">
      <option value="webcam">Webcam</option>
      <option value="front-man">Test: upright</option>
      <option value="front-headdown">Test: head down</option>
      <option value="front-hunched">Test: hunched</option>
    </select></label>
    <label>Model <select id="model"><option>heavy</option><option>full</option><option>lite</option></select></label>
    <label>Visual <select id="visual"></select></label>
  </div>
  <div class="row" style="justify-content: space-between">
    <div><div class="foot">held posture</div><div id="score">–</div></div>
    <div style="text-align:right"><div class="foot">display health</div><div id="health" style="font-size:20px">–</div></div>
  </div>
  <div class="foot" id="holdStatus"></div>
  <div id="metrics"></div>
  <div class="foot" id="foot"></div>
  <div class="lcd">
    <div class="row">
      <label>Screen <select id="dispTarget"></select></label>
      <input type="text" id="piHost" title="The Pi's address: 10.12.194.1 over the USB cable, or its name/IP on Wi-Fi" spellcheck="false">
    </div>
    <div class="row">
      <label title="Projected from above, the screen is seen mirrored: flip the stream to match">Orientation <select id="dispFlip"></select></label>
    </div>
    <div class="row">
      <label title="Lifts faint and mid tones on the external screen; black stays black">Brightness
        <input type="range" id="dispBright" min="1" max="4" step="0.1" style="width:120px; vertical-align:middle"></label>
      <span class="foot" id="dispBrightOut"></span>
    </div>
    <div class="row" style="justify-content: space-between">
      <button id="lcdBtn">Connect</button>
      <span class="foot" id="lcdStatus"></span>
    </div>
    <div id="lcdPreview" title="What the external screen shows"></div>
  </div>
  <details id="manual">
    <summary>Manual: drive the visual with sliders</summary>
    <div id="sliders" style="display:grid; gap:6px; margin-top:8px"></div>
  </details>
</aside>
<script type="module" src="src/main.js"></script>
</body>
</html>
